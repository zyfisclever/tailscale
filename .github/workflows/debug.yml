name: Debug RDP

on:
  workflow_dispatch:
    inputs:
      os_version:
        description: '选择 Windows 系统版本'
        type: choice
        required: true
        default: 'windows-2025'
        options:
          - windows-2025
          - windows-2022
          - windows-2019

jobs:
  remote-desktop:
    runs-on: ${{ github.event.inputs.os_version }}

    steps:
      - name: Checkout repository (optional)
        uses: actions/checkout@v4

      - name: Configure Core RDP Settings
        run: |
          # Enable Remote Desktop
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0

          # Disable Network Level Authentication (NLA) for compatibility
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0

          # Allow RDP through Windows Firewall
          if (-not (Get-NetFirewallRule -DisplayName "RDP-Tailscale" -ErrorAction SilentlyContinue)) {
            New-NetFirewallRule -DisplayName "RDP-Tailscale" -Direction Inbound -Protocol TCP -LocalPort 3389 -Action Allow
          }

          # Restart Terminal Services
          Restart-Service TermService -Force
        shell: powershell

      - name: Create RDP User with Secure Random Password
        run: |
          # Generate a strong 16-character password: 4 uppercase, 4 lowercase, 4 digits, 4 symbols
          $chars = @{
            upper = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'
            lower = 'abcdefghijklmnopqrstuvwxyz'
            digit = '0123456789'
            symbol = '!@#$%^&*()_+-=[]{}|;:,.<>?'
          }
          $passwordParts = @()
          $passwordParts += ($chars.upper.ToCharArray() | Get-Random -Count 4)
          $passwordParts += ($chars.lower.ToCharArray() | Get-Random -Count 4)
          $passwordParts += ($chars.digit.ToCharArray() | Get-Random -Count 4)
          $passwordParts += ($chars.symbol.ToCharArray() | Get-Random -Count 4)
          $securePassword = ($passwordParts | Sort-Object { Get-Random }) -join ''
          
          $secureString = ConvertTo-SecureString $securePassword -AsPlainText -Force
          New-LocalUser -Name "RDP" -Password $secureString -AccountNeverExpires -FullName "RDP Debug User" -Description "Temporary RDP user for GitHub Actions debugging"
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"

          # Save credentials to environment for logging
          echo "RDP_CREDS=User: RDP | Password: $securePassword" >> $env:GITHUB_ENV
          $githubEnv = "$env:GITHUB_ENV"
          Add-Content -Path $githubEnv -Value "RDP_PASSWORD=$securePassword" -Encoding UTF8
        shell: powershell

      - name: Install Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.104.5-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"
          
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Establish Tailscale Connection
        run: |
          $authKey = "${{ secrets.TAILSCALE_AUTH_KEY }}"
          if (-not $authKey) {
            Write-Error "Missing secret TAILSCALE_AUTH_KEY"
            exit 1
          }

          & 'C:\Program Files\Tailscale\tailscale.exe' up --authkey="$authKey" --hostname="gh-runner-${{ github.run_id }}" --accept-dns=false --advertise-exit-node=false

          # Wait for Tailscale IP assignment (up to 50 seconds)
          $ip = $null
          for ($i = 0; $i -lt 50; $i++) {
            $status = & 'C:\Program Files\Tailscale\tailscale.exe' status --json | ConvertFrom-Json
            $ip = $status.Self.TailscaleIPs[0]
            if ($ip -and $ip -match '^\d+\.\d+\.\d+\.\d+$') {
              break
            }
            Start-Sleep -Seconds 1
          }

          if (-not $ip) {
            Write-Error "Failed to obtain Tailscale IP"
            exit 1
          }

          echo "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV
          Write-Host "Assigned Tailscale IP: $ip"
        shell: powershell

      - name: Print RDP Connection Info and Keep Alive
        run: |
          Write-Host "=============================================="
          Write-Host "   RDP Connection Details"
          Write-Host "   Address : ${{ env.TAILSCALE_IP }}"
          Write-Host "   Username: RDP"
          Write-Host "   Password: $env:RDP_PASSWORD"
          Write-Host ""
          Write-Host "   Connect using your Tailscale client (must be logged in to the same tailnet)"
          Write-Host "   Remember to CANCEL this workflow when done to avoid unnecessary runner usage!"
          Write-Host "=============================================="

          while ($true) {
            Write-Host "$(Get-Date): Runner is alive. Waiting... (Cancel workflow to stop)"
          Start-Sleep -Seconds 300
          }
        shell: powershell
